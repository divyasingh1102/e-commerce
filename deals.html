<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer Sale Banner</title>
<style>
  :root{
    --pink: #1f4d3d;
    --pink-dark: #163a2d;
    --cream: #fdf5f0;
    --blush: #f7dfd8;
    --plum: #3a1f2b;
    --string: #1f4d3d;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height:100%;
  }

  body{
    font-family:'Poppins', Arial, sans-serif;
  }

  .card{
    position:relative;
    width:100vw;
    height:100vh;
    background: linear-gradient(135deg, var(--cream) 0%, var(--cream) 55%, var(--blush) 100%);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  /* soft wavy background band */
  .wave{
    position:absolute;
    top:0; left:0; right:0;
    width:100%;
    opacity:0.6;
  }

  /* Leaves */
  .leaf{
    position:absolute;
    opacity:0.55;
  }
  .leaf.top-right{ top:-30px; right:-40px; width:170px; transform:rotate(15deg); }
  .leaf.bottom-left{ bottom:-40px; left:-45px; width:210px; }

  /* Sparkles */
  .sparkle{
    position:absolute;
    color:var(--pink);
  }

  /* Hanging strings + letters */
  .hero{
    position:relative;
    padding-top:2vh;
    height:38vh;
    display:flex;
    justify-content:center;
  }

  .letters{
    position:relative;
    display:flex;
    z-index:2;
  }

  .letter-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .string{
    width:1px;
    background:var(--string);
    margin-bottom:0;
  }

  .letter{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    color:var(--pink);
    line-height:1;
    font-style: normal;
    animation: sway 4s ease-in-out infinite;
    transform-origin: top center;
  }

  .letter.big{ font-size:110px; }
  .letter.small{ font-size:78px; }

  @keyframes sway{
    0%, 100%{ transform: rotate(-1.2deg); }
    50%{ transform: rotate(1.2deg); }
  }

  .content{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 40px;
  }

  .tagline{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    letter-spacing:2px;
    font-size:15px;
    color:var(--plum);
    text-transform:uppercase;
    margin-bottom:34px;
  }

  .discount{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:44px;
    color:var(--plum);
    letter-spacing:1px;
  }

  .discount-label{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    letter-spacing:3px;
    font-size:15px;
    color:var(--plum);
    margin-top:6px;
    margin-bottom:34px;
  }

  .cta{
    display:inline-block;
    background:var(--pink);
    color:#fff;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    letter-spacing:2px;
    font-size:13px;
    padding:14px 44px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(31,77,61,0.4);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cta:hover{
    transform: translateY(-2px);
    box-shadow:0 12px 24px rgba(31,77,61,0.5);
  }
  .cta:active{ transform: translateY(0); }

  .date-box{
    margin:34px auto 0;
    display:inline-block;
    border:1px solid var(--plum);
    padding:12px 30px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    letter-spacing:1px;
    font-size:15px;
    color:var(--plum);
  }
  .date-box sup{ font-size:10px; }

  @media (max-width:520px){
    .card{ width:94vw; height:auto; min-height:560px; }
    .letter.big{ font-size:70px; }
    .letter.small{ font-size:50px; }
  }
</style>
</head>
<body>

<div class="card">

  <!-- Leaves -->
  <svg class="leaf top-right" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M100 10 C160 40 190 90 180 150 C140 130 90 150 60 190 C40 140 40 80 70 40 C80 25 90 15 100 10Z" stroke="#1f4d3d" stroke-width="1.5"/>
    <path d="M100 20 C110 70 110 130 90 180" stroke="#1f4d3d" stroke-width="1.2"/>
    <path d="M100 40 C130 55 145 75 150 100" stroke="#1f4d3d" stroke-width="1"/>
    <path d="M95 70 C70 80 55 95 48 115" stroke="#1f4d3d" stroke-width="1"/>
    <path d="M95 110 C120 118 135 132 142 150" stroke="#1f4d3d" stroke-width="1"/>
  </svg>

  <svg class="leaf bottom-left" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 200 C10 140 30 80 80 50 C130 20 190 30 210 60 C170 60 130 90 110 140 C95 175 70 195 20 200Z" stroke="#1f4d3d" stroke-width="1.5"/>
    <path d="M25 190 C70 160 120 130 190 65" stroke="#1f4d3d" stroke-width="1.2"/>
    <path d="M50 160 C60 130 75 105 95 85" stroke="#1f4d3d" stroke-width="1"/>
    <path d="M90 120 C105 100 125 82 150 68" stroke="#1f4d3d" stroke-width="1"/>
    <path d="M35 175 C45 150 58 128 75 108" stroke="#1f4d3d" stroke-width="1"/>
  </svg>

  <!-- Sparkles -->
  <svg class="sparkle" style="top:190px; left:20px; width:60px;" viewBox="0 0 60 60"><path d="M30 0 L36 26 L60 30 L36 34 L30 60 L24 34 L0 30 L24 26 Z" fill="#1f4d3d"/></svg>
  <svg class="sparkle" style="top:250px; left:70px; width:26px;" viewBox="0 0 60 60"><path d="M30 0 L36 26 L60 30 L36 34 L30 60 L24 34 L0 30 L24 26 Z" fill="#1f4d3d"/></svg>

  <svg class="sparkle" style="top:390px; right:40px; width:56px;" viewBox="0 0 60 60"><path d="M30 0 L36 26 L60 30 L36 34 L30 60 L24 34 L0 30 L24 26 Z" fill="#1f4d3d"/></svg>
  <svg class="sparkle" style="top:445px; right:90px; width:24px;" viewBox="0 0 60 60"><path d="M30 0 L36 26 L60 30 L36 34 L30 60 L24 34 L0 30 L24 26 Z" fill="#1f4d3d"/></svg>

  <!-- Hero: hanging letters -->
  <div class="hero">
    <div class="letters" id="letters"></div>
  </div>

  <!-- Text content -->
  <div class="content">
    <div class="tagline">Dive Into Our Summer<br>Sale Extravaganza</div>
    <div class="discount">20% OFF</div>
    <div class="discount-label">ALL ITEMS</div>
    <button class="cta" onclick="alert('Shop the sale!')">BIG SALE</button>
    <div class="date-box">2ND – 9<sup>TH</sup> OF JUNE</div>
  </div>

</div>

<script>
  // Build the hanging "SUMMER" letters with strings of varying length,
  // similar to the reference image (M's hang lower, S/R shorter strings).
  const word = [
    { ch:'S', size:'big',   string:60  },
    { ch:'U', size:'big',   string:100 },
    { ch:'M', size:'big',   string:20  },
    { ch:'M', size:'small', string:130 },
    { ch:'E', size:'small', string:60  },
    { ch:'R', size:'big',   string:100 }
  ];

  const container = document.getElementById('letters');

  word.forEach((item, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'letter-wrap';

    const string = document.createElement('div');
    string.className = 'string';
    string.style.height = item.string + 'px';
    wrap.appendChild(string);

    const letter = document.createElement('div');
    letter.className = 'letter ' + item.size;
    letter.textContent = item.ch;
    letter.style.animationDelay = (i * 0.15) + 's';
    wrap.appendChild(letter);

    container.appendChild(wrap);
  });
</script>

</body>
</html>
